<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Journova</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="register-container">

        <h1>Journova</h1>
        <h2>Login</h2>

        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}

        <form method="POST">

            <label for="email">Email</label>
            <input type="email"
                   id="email"
                   name="email"
                   required>

            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   required>

            <button type="submit">Login</button>

        </form>

        <p class="login-text">
            New to Journova?
            <a href="{{ url_for('register') }}">Create an account</a>
        </p>

    </div>

</body>
</html>

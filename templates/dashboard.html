<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journova Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="register-container dashboard-container">

        <h1>Journova</h1>
        <h2>Welcome</h2>

        <p class="dashboard-user">
            You are logged in as {{ email }}
        </p>

        <div class="dashboard-option">
            <h3>Reflective Journal</h3>
            <p>Write and save your journal entries.</p>
            <a class="dashboard-button"
               href="{{ url_for('journal') }}">
                Open Journal
            </a>
        </div>

        <div class="dashboard-option">
            <h3>Mood Tracking</h3>
            <p>Record how you are feeling today.</p>
            <a class="dashboard-button"
               href="{{ url_for('mood') }}">
                Record Mood
            </a>
        </div>

        <div class="dashboard-option">
            <h3>Emotional Tone Feedback</h3>
            <p>
                Emotional tone feedback is shown after you save
                a journal entry.
            </p>
        </div>

        <p class="login-text">
            <a href="{{ url_for('logout') }}">Logout</a>
        </p>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflective Journal - Journova</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="register-container">

        <h1>Journova</h1>
        <h2>Reflective Journal</h2>

        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}

        <form method="POST">

            <label for="entry_text">Write your journal entry</label>

            <textarea
                id="entry_text"
                name="entry_text"
                rows="8"
                required>
            </textarea>

            <br><br>

            <button type="submit">Save Entry</button>

        </form>

        <p class="login-text">
            <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
        </p>

    </div>

</body>
</html>
